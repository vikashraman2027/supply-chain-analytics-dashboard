<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="#172b4d" role="img" aria-labelledby="title description">
  <title id="title">Supply chain executive dashboard concept</title>
  <desc id="description">Static, original concept preview showing verified dataset KPIs, a monthly revenue chart, shipment status, and data quality callouts. Not a screenshot of a Power BI report.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .small { font-size: 13px; }
      .label { font-size: 14px; font-weight: 600; }
      .metric { font-size: 31px; font-weight: 700; }
      .title { font-size: 27px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f3f6fa"/>
  <rect width="232" height="900" fill="#12263f"/>
  <text x="28" y="43" fill="#ffffff" font-size="19" font-weight="700">SC / INSIGHTS</text>
  <text x="28" y="68" fill="#9fb3c8" font-size="12">SUPPLY CHAIN ANALYTICS</text>
  <rect x="16" y="108" width="200" height="42" rx="9" fill="#0f766e"/>
  <text x="38" y="135" fill="#ffffff" font-size="14" font-weight="600">Executive overview</text>
  <text x="38" y="187" fill="#cbd5e1" font-size="14">Commercial performance</text>
  <text x="38" y="231" fill="#cbd5e1" font-size="14">Inventory &amp; production</text>
  <text x="38" y="275" fill="#cbd5e1" font-size="14">Supplier performance</text>
  <text x="38" y="319" fill="#cbd5e1" font-size="14">Shipment operations</text>
  <text x="38" y="363" fill="#cbd5e1" font-size="14">Data quality</text>
  <rect x="16" y="774" width="200" height="94" rx="10" fill="#1e3a56"/>
  <text x="30" y="801" fill="#dbeafe" font-size="12" font-weight="600">DATA NOTE</text>
  <text x="30" y="824" fill="#cbd5e1" font-size="11">Illustrative portfolio data.</text>
  <text x="30" y="843" fill="#cbd5e1" font-size="11">Not company reporting.</text>

  <text x="270" y="50" class="small muted">OPERATIONS / PERFORMANCE</text>
  <text x="270" y="88" class="title">Supply chain at a glance</text>
  <text x="270" y="114" class="small muted">Verified sales aggregates | Data period: Jan 2023 - Dec 2024</text>
  <rect x="1118" y="34" width="288" height="42" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1135" y="60" fill="#9a3412" font-size="10" font-weight="700">STATIC CONCEPT - NOT A RENDERED POWER BI REPORT</text>

  <g>
    <rect class="panel" x="270" y="145" width="269" height="132" rx="12"/>
    <text x="292" y="176" class="label muted">NET REVENUE</text>
    <text x="292" y="221" class="metric">$176.95M</text>
    <text x="292" y="251" class="small muted">After discounts - CSV aggregate</text>
    <rect x="505" y="165" width="12" height="12" rx="6" fill="#0f766e"/>
    <rect class="panel" x="554" y="145" width="269" height="132" rx="12"/>
    <text x="576" y="176" class="label muted">PROFIT</text>
    <text x="576" y="221" class="metric">$48.56M</text>
    <text x="576" y="251" class="small muted">Net revenue less total cost</text>
    <rect x="789" y="165" width="12" height="12" rx="6" fill="#2563eb"/>
    <rect class="panel" x="838" y="145" width="269" height="132" rx="12"/>
    <text x="860" y="176" class="label muted">PROFIT MARGIN</text>
    <text x="860" y="221" class="metric">27.44%</text>
    <text x="860" y="251" class="small muted">Profit / net revenue</text>
    <rect x="1073" y="165" width="12" height="12" rx="6" fill="#16a34a"/>
    <rect class="panel" x="1122" y="145" width="284" height="132" rx="12"/>
    <text x="1144" y="176" class="label muted">DELIVERED SHIPMENT SHARE</text>
    <text x="1144" y="221" class="metric">75.29%</text>
    <text x="1144" y="251" class="small muted">5,647 of 7,500 records - not on-time</text>
  </g>

