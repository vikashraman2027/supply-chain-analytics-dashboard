  <text x="296" y="334" class="label">Net revenue by month</text>
  <text x="296" y="356" class="small muted">Net revenue by calendar month - compare 2023 and 2024</text>
  <rect x="805" y="348" width="10" height="10" rx="2" fill="#0f766e"/>
  <text x="821" y="358" class="small muted">2023</text>
  <rect x="870" y="348" width="10" height="10" rx="2" fill="#2563eb"/>
  <text x="886" y="358" class="small muted">2024</text>
  <line x1="323" y1="559" x2="963" y2="559" stroke="#cbd5e1"/>
  <line x1="323" y1="399" x2="323" y2="559" stroke="#cbd5e1"/>
  <line x1="323" y1="479" x2="963" y2="479" stroke="#e2e8f0" stroke-dasharray="4 5"/>
  <line x1="323" y1="399" x2="963" y2="399" stroke="#e2e8f0" stroke-dasharray="4 5"/>
  <text x="290" y="563" class="small muted">$0M</text>
  <text x="280" y="483" class="small muted">$6M</text>
  <text x="274" y="403" class="small muted">$12M</text>
  <g fill="#0f766e">
    <rect x="342" y="474" width="15" height="85" rx="3"/><rect x="392" y="474" width="15" height="85" rx="3"/>
    <rect x="442" y="470" width="15" height="89" rx="3"/><rect x="492" y="463" width="15" height="96" rx="3"/>
    <rect x="542" y="458" width="15" height="101" rx="3"/><rect x="592" y="469" width="15" height="90" rx="3"/>
    <rect x="642" y="463" width="15" height="96" rx="3"/><rect x="692" y="477" width="15" height="82" rx="3"/>
    <rect x="742" y="471" width="15" height="88" rx="3"/><rect x="792" y="414" width="15" height="145" rx="3"/>
    <rect x="842" y="444" width="15" height="115" rx="3"/><rect x="892" y="443" width="15" height="116" rx="3"/>
  </g>
  <g fill="#2563eb">
    <rect x="360" y="477" width="15" height="82" rx="3"/><rect x="410" y="463" width="15" height="96" rx="3"/>
    <rect x="460" y="470" width="15" height="89" rx="3"/><rect x="510" y="471" width="15" height="88" rx="3"/>
    <rect x="560" y="477" width="15" height="82" rx="3"/><rect x="610" y="475" width="15" height="84" rx="3"/>
    <rect x="660" y="458" width="15" height="101" rx="3"/><rect x="710" y="470" width="15" height="89" rx="3"/>
    <rect x="760" y="473" width="15" height="86" rx="3"/><rect x="810" y="419" width="15" height="140" rx="3"/>
    <rect x="860" y="444" width="15" height="115" rx="3"/><rect x="910" y="432" width="15" height="127" rx="3"/>
  </g>
  <g class="small muted" text-anchor="middle">
    <text x="358" y="581">Jan</text><text x="408" y="581">Feb</text><text x="458" y="581">Mar</text><text x="508" y="581">Apr</text>
    <text x="558" y="581">May</text><text x="608" y="581">Jun</text><text x="658" y="581">Jul</text><text x="708" y="581">Aug</text>
    <text x="758" y="581">Sep</text><text x="808" y="581">Oct</text><text x="858" y="581">Nov</text><text x="908" y="581">Dec</text>
  </g>
  <rect x="1040" y="299" width="366" height="319" rx="12" fill="#ffffff" stroke="#fecaca"/>
  <text x="1066" y="334" class="label">Data quality to resolve</text>
  <rect x="1066" y="359" width="314" height="92" rx="9" fill="#fff7ed"/>
  <text x="1084" y="386" fill="#9a3412" font-size="13" font-weight="700">SHIPMENT KEYS UNMATCHED</text>
  <text x="1084" y="410" class="small">Product: 4,142 unmatched</text>
  <text x="1084" y="432" class="small">Customer: 5,295 | Facility: 7,500</text>
  <rect x="1066" y="465" width="314" height="92" rx="9" fill="#fef2f2"/>
  <text x="1084" y="492" fill="#991b1b" font-size="13" font-weight="700">PRODUCTION RATE MISMATCH</text>
  <text x="1084" y="516" class="small">4,277 of 4,500 stored rates do not</text>
  <text x="1084" y="538" class="small">match defective units / produced.</text>
  <text x="1066" y="588" class="small muted">Do not publish affected drill-downs until fixed.</text>

  <rect class="panel" x="270" y="640" width="530" height="210" rx="12"/>
  <text x="296" y="676" class="label">Shipment status mix</text>
  <text x="296" y="699" class="small muted">Record count - no customer/product/facility attribution</text>
  <g>
    <rect x="296" y="730" width="435" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="296" y="730" width="327.5" height="18" rx="9" fill="#0f766e"/>
    <rect x="623.5" y="730" width="66" height="18" fill="#f59e0b"/>
    <rect x="689.5" y="730" width="33" height="18" fill="#dc2626"/>
    <rect x="722.5" y="730" width="8.5" height="18" rx="4" fill="#64748b"/>
  </g>
  <circle cx="302" cy="779" r="5" fill="#0f766e"/><text x="313" y="784" class="small">Delivered 5,647</text>
  <circle cx="455" cy="779" r="5" fill="#f59e0b"/><text x="466" y="784" class="small">In transit 1,140</text>
  <circle cx="607" cy="779" r="5" fill="#dc2626"/><text x="618" y="784" class="small">Delayed 573</text>
  <text x="296" y="823" class="small muted">Processing 140 - total shipment records 7,500</text>

  <rect class="panel" x="824" y="640" width="582" height="210" rx="12"/>
  <text x="850" y="676" class="label">Executive readout</text>
  <text x="850" y="710" font-size="14" font-weight="600">Commercial performance</text>
  <text x="850" y="735" class="small muted">Sales calculations reconcile to the supplied row-level totals.</text>
  <text x="850" y="768" font-size="14" font-weight="600">Operational confidence</text>
  <text x="850" y="793" class="small muted">Fix shipment mappings and validate defect-rate definitions</text>
  <text x="850" y="814" class="small muted">before using those breakdowns for decisions.</text>
  <text x="850" y="840" fill="#0f766e" font-size="12" font-weight="700">METRIC DEFINITIONS > docs/data-quality.md</text>
</svg>
